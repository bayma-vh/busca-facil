# Usado só nos testes: este arquivo substitui o application.properties principal.
# H2 = banco em memória, criado e destruído junto com os testes (não precisa do MySQL/Docker).
# MODE=MySQL faz o H2 imitar o dialeto do MySQL.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# create-drop = cria as tabelas no início dos testes e apaga no fim.
spring.jpa.hibernate.ddl-auto=create-drop
