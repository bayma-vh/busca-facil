spring.application.name=backend

# Lê o .env da raiz do projeto como se fosse um .properties.
# "optional:" = se o arquivo não existir (ex.: dentro do Docker), segue sem erro.
# São dois caminhos porque a IDE pode rodar a partir da raiz ou da pasta backend/.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------- Banco de dados ----------
# No Docker, o compose define SPRING_DATASOURCE_URL e ela vence.
# No seu PC, vale o padrão: MySQL do Docker exposto na porta 3307.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/busca_facil?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

# ---------- JPA / Hibernate ----------
# update = cria e ajusta as tabelas a partir das classes @Entity.
spring.jpa.hibernate.ddl-auto=update
# Imprime no log o SQL gerado pelo Hibernate. Ótimo para aprender.
spring.jpa.show-sql=true

# ---------- Web ----------
# false = o acesso ao banco termina junto com a transação do service,
# e não fica aberto durante a escrita da resposta HTTP (o padrão "true" gera um aviso no log).
spring.jpa.open-in-view=false
# true = erros padrão do Spring (JSON malformado, id não numérico, rota inexistente...)
# também usam o formato Problem Details, igual aos do TratadorDeErros.
spring.mvc.problemdetails.enabled=true
